name: Bug
description: Something ARA Desktop does that it shouldn't, or doesn't do that it should.
labels: ["bug"]
body:
  - type: input
    id: build
    attributes:
      label: Build
      description: The version you're running, from the installer name or the tag you were given.
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: System
      description: Windows version, and anything unusual about the setup (multiple monitors, scaling, VM).
      placeholder: Windows 11 24H2, two monitors at 150% scaling
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
      placeholder: |
        Expected the window to reopen where I left it.
        It opened on the primary monitor at the default size.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to get back to it
      description: Rough steps are fine. "Happened once, can't reproduce" is worth knowing too.

  - type: textarea
    id: log
    attributes:
      label: Logs or error output
      description: >
        Any error message the app showed, or output from the terminal if you ran it from one.
        Paste the last few lines; this is usually what identifies the cause.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A screenshot if there was anything visible.

  - type: markdown
    attributes:
      value: >
        **Don't paste passwords, tokens or other secrets.** Check logs and screenshots before
        attaching them.
