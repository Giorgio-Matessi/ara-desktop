name: Feature
description: Something ARA Desktop should do that it doesn't.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's awkward today, from the user's side of the screen. Not the solution yet.
      placeholder: >
        The window always opens at the default size, so I resize and move it every time I
        start the app.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we'd know it works. One or two things that would have to be true.

  - type: textarea
    id: alternatives
    attributes:
      label: Anything already considered
      description: Approaches you've ruled out, and why. Saves rediscovering them.
